# secrets_config.yaml — forbidden patterns for the dev-tools pre-push hook
#
# Copy to secrets_config.yaml and customize for your project.
# secrets_config.yaml is committed to the repo (NOT in .gitignore).

# File patterns that should never be pushed (glob-style, matched against basename)
forbidden_files:
  - "*.env"
  - "*.bak"
  - "*.password"
  - "restic.password"
  - "pending.env"
  - "email.env"
  - "*.pem"
  - "id_rsa"
  - "id_ed25519"

# Regex patterns that should never appear in any diff
forbidden_patterns:
  - 'ghp_[A-Za-z0-9]{20,}'          # GitHub personal access token (classic)
  - 'github_pat_[A-Za-z0-9_]{20,}'  # GitHub fine-grained token
  - 'sk-[A-Za-z0-9]{32,}'           # OpenAI API key
  - 'xox[bpras]-[A-Za-z0-9-]+'      # Slack token
  - 'AKIA[0-9A-Z]{16}'              # AWS Access Key ID
  - 'AIza[0-9A-Za-z\-_]{35}'        # Google API key
  - 'gho_[A-Za-z0-9]{36,}'          # GitHub OAuth token
  - 'glpat-[A-Za-z0-9\-_]{20,}'     # GitLab personal access token
