# probe_config.yaml — portfolio-showcase probe configuration
#
# Read by the repo's local pre-commit hook and re-read by CI
# (.github/workflows/ci.yml) as the single source of truth for the test command,
# so the two gates cannot drift apart.
#
# Deliberate choices for a self-contained, single-machine app:
#   - No `ssh` block. Nothing here is remote. (The hook's probe step still
#     performs one reachability check against its built-in default host and
#     ignores the result, since no entry targets it. There is no config key to
#     disable that, so the hook discards the noise.)
#   - No services / timers. This app runs on demand via scripts/quick-start.sh,
#     not as a background unit.
#   - No `ports:` / `cron:` keys. The probe does not read them. The dashboard
#     port is 8090, fixed in scripts/quick-start.sh and documented in
#     LOCAL_SETUP.md.
#   - The JSON root, README, case study and dashboard footer all carry the
#     illustrative-data disclaimer and `data_as_of: 2026-10-01`.

services: []
timers: []

# Report size of the seeded SQLite artifact. It is generated by
# scripts/quick-start.sh and is NOT committed (see .gitignore).
databases:
  - path: pricing-scraper/data/market_data.db

# Hermetic unit tests (tests/) followed by a headless run of the analysis
# notebook, executed with the repo venv — the same interpreter and command
# locally and in CI. CI provisions a root `.venv` before reading this command
# (see .github/workflows/ci.yml), so the single command below works in both
# places and the pre-commit hook and CI cannot drift apart.
#
# Phase B narrowed this from the scaffold-era `[ ! -d tests ]` guard now that
# tests/ exists. Phase D appended the notebook gate: `nbconvert --execute`
# re-runs every cell from a clean kernel and exits non-zero on the first error,
# so a broken walkthrough blocks the commit and the build exactly like a failing
# test. The executed notebook itself is written to stdout and discarded — a cell
# failure is reported on stderr, which stays visible in both gates. The notebook
# seeds the gitignored database if it is absent, so the gate needs no prior step.
tests:
  command: ".venv/bin/python -m pytest tests/ -q && .venv/bin/jupyter nbconvert --to notebook --execute --stdout notebooks/pricing_walkthrough.ipynb > /dev/null"

snapshot:
  path: SYSTEM_SNAPSHOT.md
