# probe_config.yaml — portfolio-showcase service probe configuration
#
# Adapted from algo-trader/probe_config.yaml for a self-contained showcase repo.
# Read by the dev-tools pre-commit hook (scripts/git-hooks/dev-tools/probe.py)
# and re-read by CI (.github/workflows/ci.yml) as the single source of truth for
# the test command.
#
# Deliberate differences from algo-trader:
#   - No `ssh` block. Nothing here runs on the NUC. Note: probe.py still performs
#     one reachability check against its default host and ignores the result
#     (there are no `target: nuc` entries to probe), so the hook discards that
#     stderr noise. There is no config key to disable it.
#   - No services / timers. This app runs on demand via scripts/quick-start.sh,
#     not as a systemd unit.
#   - No `ports:` / `cron:` keys. probe.py does not read them (they are inert in
#     probe_config.example.yaml). The dashboard port is 8090, fixed in
#     scripts/quick-start.sh and documented in LOCAL_SETUP.md.
#   - The JSON root, README, case study and dashboard footer all carry the
#     illustrative-data disclaimer and `data_as_of: 2026-10-01`.

services: []
timers: []

# Report size of the seeded SQLite artifact. It is generated by
# scripts/quick-start.sh and is NOT committed (see .gitignore, Decision 1).
databases:
  - path: pricing-scraper/data/market_data.db

# Hermetic unit tests (tests/). Prefers the repo venv when present; falls back to
# the runner python, which CI provisions via requirements-dev.txt.
#
# SCAFFOLDING GUARD: the `[ ! -d tests ]` branch exists only because Phase A
# (scaffold) lands before Phase B (which adds tests/). Phase B should narrow this
# to the plan's canonical command: `.venv/bin/python -m pytest tests/ -q`
tests:
  command: "if [ ! -d tests ]; then echo 'no tests/ yet (added in Phase B) — nothing to run'; elif [ -x .venv/bin/python ]; then .venv/bin/python -m pytest tests/ -q; elif [ -x venv/bin/python ]; then venv/bin/python -m pytest tests/ -q; else python3 -m pytest tests/ -q; fi"

snapshot:
  path: SYSTEM_SNAPSHOT.md
