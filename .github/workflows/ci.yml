# CI — hermetic validation only.
#
# Every step is INLINED on purpose: a CI job must never depend on a script that
# lives in a gitignored directory. Gitignored paths are absent from a GitHub
# checkout, so such a job fails (exit 127) on every push while passing locally.
# The local git hooks are a developer convenience and are deliberately not part
# of CI.
#
# Lint and type-check are omitted because nothing here configures them (no
# ruff/mypy config, no .pre-commit-config.yaml, no `make lint`). Snapshot refresh
# is skipped: it is meaningless on a runner. The test suite is driven by
# probe_config.yaml → tests.command, the same single source of truth the local
# pre-commit hook uses, so local and CI cannot drift.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate probe_config.yaml
        # Fail fast with a clear YAML error before the read below (mirrors the
        # pre-commit hook's local schema validation).
        run: python3 -c "import yaml; yaml.safe_load(open('probe_config.yaml'))"

      - name: Run hermetic tests (per probe_config.yaml tests.command)
        run: |
          TEST_CMD="$(python3 -c "import yaml; print(yaml.safe_load(open('probe_config.yaml'))['tests']['command'])")"
          if [ -z "$TEST_CMD" ]; then
            echo "❌ probe_config.yaml → tests.command is empty or missing"
            exit 1
          fi
          echo "Running: $TEST_CMD"
          bash -c "$TEST_CMD"
